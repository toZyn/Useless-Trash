
name: ZBack | Interactive Ubuntu

on:
  workflow_dispatch:

permissions: {}

jobs:
  zback:
    name: Ubuntu Administrator
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    steps:
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends expect
          npm install --global zback

      - name: Start ZBack Interactive Session
        env:
          TERM: xterm-256color
          FORCE_COLOR: '1'
        run: |
          set -euo pipefail

          expect <<'EXPECT'
          log_user 1
          set timeout -1

          set authorized 0
          set workspace_configured 0

          spawn sudo env \
            PATH=$env(PATH) \
            TERM=xterm-256color \
            FORCE_COLOR=1 \
            zback

          expect {
            -re {Your choice \[y/N\]:} {
              if {!$authorized} {
                set authorized 1
                send -- "Y\r"
              }
              exp_continue
            }

            -re {Your choice \[Y/n\]:} {
              if {!$workspace_configured} {
                set workspace_configured 1
                send -- "N\r"
              }
              exp_continue
            }

            eof {}
          }

          set result [wait]
          exit [lindex $result 3]
          EXPECT
