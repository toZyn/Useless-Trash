
name: ZBack | Interactive Ubuntu

on:
  workflow_dispatch:

permissions: {}

jobs:
  zback:
    name: Ubuntu Interactive Environment
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    steps:
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ZBack
        run: |
          npm install --global zback
          command -v zback

      - name: Launch Interactive Terminal
        env:
          TERM: xterm-256color
          FORCE_COLOR: '1'
        run: |
          set -euo pipefail

          script -qefc \
            'sudo env "PATH=$PATH" TERM=xterm-256color FORCE_COLOR=1 zback' \
            /dev/null
            
